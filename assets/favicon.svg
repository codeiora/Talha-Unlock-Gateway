<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="keyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#keyGlow)">
    <!-- Key Bow (Ring) -->
    <circle cx="68" cy="32" r="22" fill="none" stroke="url(#goldKey)" stroke-width="6"/>
    <circle cx="68" cy="32" r="9" fill="none" stroke="url(#goldKey)" stroke-width="4"/>
    <!-- Ornate inner detail -->
    <circle cx="68" cy="32" r="3" fill="url(#goldKey)"/>
    <!-- Key Collar -->
    <rect x="49" y="46" width="7" height="7" rx="2" transform="rotate(-45 52.5 49.5)" fill="url(#goldKey)"/>
    <!-- Key Shaft -->
    <line x1="52" y1="48" x2="20" y2="80" stroke="url(#goldKey)" stroke-width="6" stroke-linecap="round"/>
    <!-- Key Bit 1 -->
    <line x1="28" y1="72" x2="36" y2="80" stroke="url(#goldKey)" stroke-width="5" stroke-linecap="square"/>
    <!-- Key Bit 2 (End notch) -->
    <line x1="20" y1="80" x2="27" y2="87" stroke="url(#goldKey)" stroke-width="5" stroke-linecap="square"/>
    <!-- Key Bit sub-tooth -->
    <line x1="33" y1="77" x2="37" y2="73" stroke="url(#goldKey)" stroke-width="3" stroke-linecap="square"/>
  </g>
</svg>
